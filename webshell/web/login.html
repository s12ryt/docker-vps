<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>WebShell — Login</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #1a1b26; color: #c0caf5;
    font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  .card {
    width: min(92vw, 340px); padding: 34px 30px 30px;
    background: #24283b; border-radius: 14px;
    box-shadow: 0 14px 40px rgba(0,0,0,.45);
  }
  .card h1 { margin: 0 0 4px; font-size: 20px; color: #e6e9f5; }
  .card p.sub { margin: 0 0 22px; font-size: 13px; color: #7a83b0; }
  label { display: block; margin-bottom: 6px; font-size: 13px; color: #a9b1d6; }
  input[type=password] {
    width: 100%; box-sizing: border-box; padding: 10px 12px;
    background: #1f2335; color: #c0caf5;
    border: 1px solid #3b4261; border-radius: 8px; outline: none;
    font-size: 15px;
  }
  input[type=password]:focus { border-color: #7aa2f7; }
  button {
    width: 100%; margin-top: 16px; padding: 10px 0;
    background: #7aa2f7; color: #1a1b26; font-weight: 600; font-size: 15px;
    border: none; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  #err {
    display: none; margin-top: 14px; padding: 8px 12px;
    background: rgba(247,118,142,.12); color: #f7768e;
    border-radius: 8px; font-size: 13px;
  }
</style>
</head>
<body data-page="login">
  <main class="card">
    <h1>🔐 WebShell</h1>
    <p class="sub">This endpoint is password protected.</p>
    <form id="login-form" method="post" action="/login">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
      <button id="submit" type="submit">Sign in</button>
      <div id="err" role="alert"></div>
    </form>
  </main>

<script>
(function () {
  'use strict';
  // Progressive enhancement: native POST works without JS;
  // with JS we show inline errors instead of the raw 401 page.
  var form = document.getElementById('login-form');
  var err = document.getElementById('err');
  var btn = document.getElementById('submit');

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    btn.disabled = true;
    err.style.display = 'none';

    var body = new URLSearchParams(new FormData(form)).toString();
    fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body,
      credentials: 'same-origin',
      redirect: 'follow'
    }).then(function (res) {
      if (res.redirected || res.ok) {
        window.location.replace('/');
      } else {
        throw new Error('HTTP ' + res.status);
      }
    }).catch(function () {
      err.textContent = 'Wrong password, please try again.';
      err.style.display = 'block';
      btn.disabled = false;
      document.getElementById('password').select();
    });
  });
})();
</script>
</body>
</html>
